version: "1"
kind: miner
id: 7313
slug: optivis-gas
protocol: generic
name: Optivis Gas Price
description: "Verifiable EVM gas price (gwei) for transaction optimisation bots. Wraps keyless publicnode.com JSON-RPC eth_gasPrice for Base, Ethereum and other EVM chains. Solana-first framing: Base default. Returns current gas price in wei (hex) plus gwei."
base_url: https://base-rpc.publicnode.com

docs:
  website: https://github.com/vip-ultr/optivis-telegraph-miners
  documentation: https://github.com/vip-ultr/optivis-telegraph-miners
  repository: https://github.com/vip-ultr/optivis-telegraph-miners
  twitter: "https://x.com/vip_ultr"

auth:
  type: none

rate_limit_per_sec: 5
cache_ttl_sec: 15
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /gas
    external_path: /
    method: POST
    content_type: application/json
    description: "Current Base gas price via JSON-RPC eth_gasPrice against keyless publicnode.com Base RPC. Returns gas price in wei (hex) plus gwei."
    intents:
      - GAS_PRICE
    body:
      jsonrpc: "2.0"
      method: eth_gasPrice
      params: []
      id: 1

input_schema:
  type: object
  properties: {}

output_schema:
  type: object
  properties:
    gas_price_wei:
      type: string
      description: "Hex-encoded gas price in wei from eth_gasPrice result."
    gas_price_gwei:
      type: number
      description: "Gas price converted to gwei."
    chain:
      type: string
      description: "Which chain was queried."

semantics:
  signal_mapping:
    label_field: gas_price_gwei
  supported_intents:
    - GAS_PRICE

on_chain:
  description: "Stores the current gas price in gwei plus the chain tag so downstream agents and contracts can consume verified gas signal on-chain."
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: chain
        source_path: chain
        description: "Chain queried (base)."
    integers:
      - index: 0
        name: gas_price_gwei_x1000
        source_path: gas_price_gwei
        multiplier: 1000
        description: "Gas price in gwei scaled by 1000."
