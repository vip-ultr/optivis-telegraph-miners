version: "1"
kind: miner
id: 7313
slug: optivis-gas
protocol: generic
name: Optivis Gas Oracle
description: >-
  Verifiable network gas price for autonomous transaction-optimisation agents.
  Wraps a keyless Ethereum JSON-RPC (eth_gasPrice) and reports the current gas
  price in gwei. No API key, no account - the node calls a public RPC directly.
  Useful for agents deciding when to send transactions, estimate fees, or
  monitor network congestion before acting on-chain.

base_url: https://eth.meowrpc.com

docs:
  website: https://github.com/vip-ultr/optivis-telegraph-miners
  documentation: https://github.com/vip-ultr/optivis-telegraph-miners
  repository: https://github.com/vip-ultr/optivis-telegraph-miners
  twitter: "@vip_ultr"

auth:
  type: none

rate_limit_per_sec: 10
cache_ttl_sec: 15
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /gas
    external_path: ""
    method: POST
    content_type: application/json
    description: "Current Ethereum gas price in gwei via eth_gasPrice (JSON-RPC)."
    intents: [GAS_PRICE]
    params:
      query:
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: Chain name (reserved; defaults to ethereum).
            default: ethereum

input_schema:
  type: object
  properties:
    chain:
      type: string
      description: Chain name (reserved for future multi-chain support).

output_schema:
  type: object
  properties:
    gas_gwei:
      type: number
      description: Current gas price in gwei.
    source:
      type: string

semantics:
  signal_mapping:
    label_field: gas_gwei
  supported_intents:
    - GAS_PRICE

on_chain:
  description: "Stores the current gas price in gwei plus a source tag so downstream agents and contracts can consume verified network congestion signal directly on-chain."
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: source
        source_path: source
        description: "Upstream RPC that produced the gas price."
    integers:
      - index: 0
        name: gas_gwei_x100
        source_path: gas_gwei
        multiplier: 100
        description: "Current gas price in gwei scaled by 100."

  # Reverse direction: re-inject a stored on-chain value into an API call.
  # Benign for our stateless miners - the upstream ignores the extra param.
  request:
    - endpoint: gas
      method: POST
      query_params:
        ref:
          source: strings.0
          type: string
          optional: true
