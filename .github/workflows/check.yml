name: verify-miners

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate YAML structure
        run: python3 tools/validate_yaml.py
      - name: Verify upstream field paths
        run: python3 tools/verify_upstream.py
